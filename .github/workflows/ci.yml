# The whole verification (npm run verify) on every push and pull request, on each Node version
# package.json's engines promise. It runs without privacy.local.txt, so the privacy test uses the
# generic patterns alone. Actions are pinned by commit SHA (the tag after it is for people and
# dependabot); gitleaks is pinned by version and checksum.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install the development tools
        run: |
          npm ci
          npm --prefix mcp ci
      # Chromium for the golden frames (scripts/frames.js); here they only check that two renders
      # agree, since the stored hashes come from the maintainer's fonts.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium-headless-shell
      # Outside the checkout: the privacy test scans new files, and the archive and the binary
      # carry gitleaks' own sample secrets and paths.
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar xzf "${file}" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Verify
        run: npm run verify
